name: jarvis_ai_mobile
description: JARVIS AI mobile app (skeleton)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5

  flutter_riverpod: ^2.3.6
  go_router: ^6.5.0
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  glassmorphism: ^2.0.0
  google_generative_ai: ^0.2.0
  speech_to_text: ^5.8.0
  flutter_tts: ^3.6.0
  permission_handler: ^10.4.0
  audio_session: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
